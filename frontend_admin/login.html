<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCDS | ADMIN ACCESS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-color: #0a0a0a;
            --text-color: #00ff41;
            --error-color: #ff0000;
            --dim-color: #008f11;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .terminal-window {
            width: 400px;
            border: 2px solid var(--dim-color);
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            position: relative;
        }

        .terminal-header {
            border-bottom: 1px solid var(--dim-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--dim-color);
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--dim-color);
            color: var(--text-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            padding: 5px 0;
            outline: none;
        }

        input:focus {
            border-bottom-color: var(--text-color);
        }

        button {
            width: 100%;
            background: var(--dim-color);
            color: #000;
            border: none;
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--text-color);
            box-shadow: 0 0 15px var(--text-color);
        }

        .error-msg {
            color: var(--error-color);
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
            font-size: 0.9rem;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(0, 255, 65, 0.1);
            animation: scan 3s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: 0;
            }

            100% {
                top: 100%;
            }
        }

        .blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="terminal-window">
        <div class="scan-line"></div>
        <div class="terminal-header">
            > PCDS_ADMIN_AUTH_V1.0 <span class="blink">_</span>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label>> USERNAME</label>
                <input type="text" id="username" autocomplete="off" autofocus>
            </div>
            <div class="input-group">
                <label>> PASSWORD</label>
                <input type="password" id="password">
            </div>

            <button type="submit">AUTHENTICATE</button>
        </form>

        <div class="error-msg" id="errorMsg"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.innerText = "CONNECTING...";

            try {
                const res = await fetch('/admin/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    errorMsg.style.color = "#00ff41";
                    errorMsg.innerText = "ACCESS GRANTED. REDIRECTING...";
                    localStorage.setItem('admin_token', data.token);
                    setTimeout(() => {
                        window.location.href = '/admin/';
                    }, 1000);
                } else {
                    errorMsg.style.color = "#ff0000";
                    errorMsg.innerText = "ACCESS DENIED: INVALID CREDENTIALS";
                }
            } catch (err) {
                errorMsg.style.color = "#ff0000";
                errorMsg.innerText = "CONNECTION ERROR";
            }
        });
    </script>
</body>

</html>
