PCDS Logstash Configuration

Usage: logstash -f logstash.conf

input {

Listen for logs sent from Node.js via TCP

tcp {
port => 5000
codec => json_lines
}
}

filter {

Parse specific PCDS event fields

if [type] == "traffic_log" {
date {
match => [ "timestamp", "ISO8601" ]
}
mutate {
add_tag => [ "pcds_traffic" ]
}
}
}

output {

Forward to Elasticsearch

elasticsearch {
hosts => ["http://localhost:9200"]
index => "pcds-events-%{+YYYY.MM.dd}"
}

Debug output to console

stdout { codec => rubydebug }
}