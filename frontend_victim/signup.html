<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SDC Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-color: #4f46e5;
            --brand-hover: #4338ca;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }

        .brand {
            color: var(--brand-color);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 {
            margin: 0 0 8px 0;
            color: var(--text-primary);
        }

        p.subtitle {
            margin: 0 0 32px 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--brand-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--brand-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--brand-hover);
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--brand-color);
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: #fef2f2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #fecaca;
        }

        .success-msg {
            background: #f0fdf4;
            color: #166534;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand"><i class="fa-solid fa-cube"></i> LegacyCorp</div>
        <h2>Create Account</h2>
        <p class="subtitle">Start your secure banking journey.</p>

        <div id="error" class="error-msg"></div>
        <div id="success" class="success-msg"></div>

        <form onsubmit="handleSignup(event)">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="fullname" placeholder="e.g. John Doe" required>
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="btn">Sign Up</button>
        </form>

        <div class="footer">
            Already have an account? <a href="/login.html">Sign in</a>
        </div>
    </div>

    <script>
        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('btn');
            const error = document.getElementById('error');
            const success = document.getElementById('success');

            const fullName = document.getElementById('fullname').value;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            btn.innerText = "Creating Account...";
            btn.disabled = true;
            error.style.display = 'none';
            success.style.display = 'none';

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass, fullName: fullName })
                });
                const data = await res.json();

                if (res.ok) {
                    success.innerText = "Account created! Redirecting...";
                    success.style.display = 'block';
                    setTimeout(() => { window.location.href = '/login.html'; }, 1500);
                } else {
                    error.innerText = data.error || "Signup failed";
                    error.style.display = 'block';
                    btn.innerText = "Sign Up";
                    btn.disabled = false;
                }
            } catch (err) {
                error.innerText = "Connection error";
                error.style.display = 'block';
                btn.innerText = "Sign Up";
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
